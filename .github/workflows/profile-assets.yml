name: Refresh Profile Assets

on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "47 15 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Generate dark GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_border=true&bg_color=0D1117&title_color=00E5FF&text_color=CBD5E1&icon_color=A76BFF&ring_color=00E5FF&custom_title=Engineering%20Telemetry
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate dark language signals
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide=jupyter%20notebook&size_weight=0.5&count_weight=0.5&hide_border=true&bg_color=0D1117&title_color=00E5FF&text_color=CBD5E1&custom_title=Codebase%20Signals
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate light GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_border=true&bg_color=FFFFFF&title_color=0369A1&text_color=334155&icon_color=7C3AED&ring_color=0369A1&custom_title=Engineering%20Telemetry
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate light language signals
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide=jupyter%20notebook&size_weight=0.5&count_weight=0.5&hide_border=true&bg_color=FFFFFF&title_color=0369A1&text_color=334155&custom_title=Codebase%20Signals
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate contribution matrix
        uses: Platane/snk@v3
        with:
          github_user_name: RITESH2127
          outputs: |
            profile/contribution-light.svg
            profile/contribution-dark.svg?palette=github-dark

      - name: Verify profile assets
        shell: bash
        run: |
          set -euo pipefail
          for file in             profile/stats-dark.svg             profile/stats-light.svg             profile/top-langs-dark.svg             profile/top-langs-light.svg             profile/contribution-dark.svg             profile/contribution-light.svg
          do
            test -s "$file"
            grep -q "<svg" "$file"
          done

      - name: Commit refreshed profile assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "Profile assets are already current."
            exit 0
          fi
          git commit -m "chore: refresh profile assets"
          git push

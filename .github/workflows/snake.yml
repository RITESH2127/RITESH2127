name: Generate Contribution Matrix

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: contribution-matrix
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Generate contribution animation
        uses: Platane/snk@v3
        with:
          github_user_name: RITESH2127
          outputs: |
            profile/contribution-light.svg
            profile/contribution-dark.svg?palette=github-dark

      - name: Verify generated animation
        shell: bash
        run: |
          set -euo pipefail
          test -s profile/contribution-light.svg
          test -s profile/contribution-dark.svg
          grep -q "<svg" profile/contribution-light.svg
          grep -q "<svg" profile/contribution-dark.svg

      - name: Commit contribution matrix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/contribution-*.svg
          if git diff --cached --quiet; then
            echo "No contribution changes."
            exit 0
          fi
          git commit -m "chore: refresh contribution matrix"
          git push
